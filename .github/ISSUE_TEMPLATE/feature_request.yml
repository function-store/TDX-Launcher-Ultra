name: Feature request
description: An idea for TDX Launcher Ultra
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or workflow, in your own words — not the solution yet.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you do today instead?
