<!doctype html>
<!-- Generative preview scenes for the TDXLU demo gallery. Deterministic:
     window.renderFrame(scene, i, n) draws frame i of n; the driver script
     pulls PNGs per frame and ffmpeg assembles seamless loops. -->
<meta charset="utf-8" />
<body style="margin:0;background:#111">
<canvas id="c" width="640" height="360"></canvas>
<script>
const W = 640, H = 360;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

/* Deterministic per-scene PRNG (mulberry32) so layouts never change. */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── AuroraSet — layered aurora ribbons over a star field ─────────────── */
const auroraStars = (() => {
  const r = rng(11);
  return Array.from({length: 90}, () => ({x: r()*W, y: r()*H*0.75, z: r(), tw: r()*TAU}));
})();
function aurora(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02040a'); g.addColorStop(1, '#04101c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of auroraStars) {
    const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(t * TAU * 2 + s.tw));
    ctx.fillStyle = `rgba(210,225,255,${(a * (0.3 + s.z * 0.7)).toFixed(3)})`;
    ctx.fillRect(s.x, s.y, s.z > 0.85 ? 2 : 1, s.z > 0.85 ? 2 : 1);
  }
  ctx.globalCompositeOperation = 'lighter';
  const bands = [
    {hue: 150, yb: 0.30, amp: 44, ph: 0.0, w: 130, sp: 1},
    {hue: 170, yb: 0.42, amp: 34, ph: 2.1, w: 150, sp: -1},
    {hue: 300, yb: 0.24, amp: 52, ph: 4.0, w: 100, sp: 1},
  ];
  for (const b of bands) {
    for (let x = 0; x <= W; x += 3) {
      const u = x / W;
      const y = H * b.yb
        + Math.sin(u * 4.2 + b.ph + b.sp * t * TAU) * b.amp
        + Math.sin(u * 9.1 - b.sp * t * TAU * 2 + b.ph) * b.amp * 0.30;
      // Curtain flicker: the vertical rays that make it read as aurora.
      const flick =
        0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(u * 26 + b.sp * t * TAU * 5 + b.ph), 2) *
        (0.5 + 0.5 * Math.sin(u * 7 - t * TAU + b.ph));
      const rayLen = b.w * (0.6 + flick * 0.8);
      const gg = ctx.createLinearGradient(0, y, 0, y + rayLen);
      gg.addColorStop(0, `hsla(${b.hue},100%,72%,${(0.55 * flick).toFixed(3)})`);
      gg.addColorStop(0.18, `hsla(${b.hue},95%,58%,${(0.30 * flick).toFixed(3)})`);
      gg.addColorStop(1, `hsla(${(b.hue + 40) % 360},90%,45%,0)`);
      ctx.fillStyle = gg;
      ctx.fillRect(x, y, 3, rayLen);
      // Bright lower edge — the aurora's crisp emission line.
      ctx.fillStyle = `hsla(${b.hue},100%,80%,${(0.5 * flick).toFixed(3)})`;
      ctx.fillRect(x, y - 1, 3, 2.5);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createLinearGradient(0, H * 0.72, 0, H);
  vg.addColorStop(0, 'rgba(2,6,10,0)'); vg.addColorStop(1, 'rgba(1,3,6,0.9)');
  ctx.fillStyle = vg; ctx.fillRect(0, H * 0.72, W, H * 0.28);
}

/* ── ParticleWall — LED wall of dots displaced by crossing waves ──────── */
function particleWall(t) {
  ctx.fillStyle = '#050208'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const cols = 56, rows = 30;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const u = i / (cols - 1), v = j / (rows - 1);
      const w1 = Math.sin(u * 5.0 + v * 2.0 + t * TAU);
      const w2 = Math.sin((u - v) * 7.0 - t * TAU * 2);
      const w3 = Math.sin(Math.hypot(u - 0.5, v - 0.5) * 11 - t * TAU * 2);
      const e = (w1 + w2 + w3) / 3;
      const x = 14 + u * (W - 28) + w2 * 3;
      const y = 12 + v * (H - 24) + w1 * 4;
      const r = 1.1 + (e + 1) * 1.5;
      const hue = 265 + e * 60 + u * 30;
      const a = 0.22 + (e + 1) * 0.30;
      ctx.fillStyle = `hsla(${hue},90%,${52 + e * 18}%,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ── KinectRig — depth-shaded torus-knot point cloud, slow tumble ─────── */
const knotPts = (() => {
  const r = rng(7); const pts = [];
  for (let i = 0; i < 2600; i++) {
    const u = (i / 2600) * TAU * 3;
    const p = 2, q = 3;
    const rr = Math.cos(q * u) + 2.2;
    pts.push({
      x: rr * Math.cos(p * u) + (r() - 0.5) * 0.16,
      y: rr * Math.sin(p * u) + (r() - 0.5) * 0.16,
      z: -Math.sin(q * u) + (r() - 0.5) * 0.16,
    });
  }
  return pts;
})();
function kinect(t) {
  ctx.fillStyle = '#03060a'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const a1 = t * TAU, a2 = Math.sin(t * TAU) * 0.5 + 0.4;
  const ca = Math.cos(a1), sa = Math.sin(a1), cb = Math.cos(a2), sb = Math.sin(a2);
  const drawn = knotPts.map((p) => {
    let x = p.x * ca - p.z * sa, z = p.x * sa + p.z * ca, y = p.y;
    let y2 = y * cb - z * sb; z = y * sb + z * cb;
    const d = 6.4 + z;
    return {sx: W / 2 + (x / d) * 420, sy: H / 2 + (y2 / d) * 420, z, d};
  }).sort((p, q) => q.z - p.z);
  for (const p of drawn) {
    const depth = (p.z + 3.4) / 6.8;
    const r = 0.7 + (1 - depth) * 1.9;
    const hue = 160 + depth * 110;
    ctx.fillStyle = `hsla(${hue},85%,${40 + (1 - depth) * 35}%,${0.16 + (1 - depth) * 0.5})`;
    ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ── StageMapping — mapped panels, sweep line, edge glints ────────────── */
const stagePanels = (() => {
  const r = rng(23); const panels = [];
  const cx = W * 0.5, cy = H * 0.56;
  for (let i = 0; i < 15; i++) {
    const ang = (i / 15) * TAU + r() * 0.5;
    const dist = 60 + r() * 190;
    const px = cx + Math.cos(ang) * dist * 1.5;
    const py = cy + Math.sin(ang) * dist * 0.55 - r() * 40;
    const w = 46 + r() * 90, h = 30 + r() * 70;
    const sk = (r() - 0.5) * 0.9;
    panels.push({px, py, w, h, sk, ph: r() * TAU, hue: [195, 165, 320, 45][i % 4]});
  }
  return panels;
})();
function stage(t) {
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
  const fg = ctx.createRadialGradient(W/2, H*0.62, 40, W/2, H*0.62, 420);
  fg.addColorStop(0, 'rgba(28,30,38,0.55)'); fg.addColorStop(1, 'rgba(5,5,5,0)');
  ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  const sweep = ((t * 2) % 1) * (W + 300) - 150;
  for (const p of stagePanels) {
    const pulse = 0.5 + 0.5 * Math.sin(t * TAU * 2 + p.ph);
    const hit = Math.max(0, 1 - Math.abs((p.px - sweep) / 130));
    const lum = 8 + pulse * 10 + hit * 38;
    const alp = 0.55 + hit * 0.45;
    ctx.save();
    ctx.translate(p.px, p.py); ctx.transform(1, p.sk * 0.16, p.sk, 1, 0, 0);
    ctx.fillStyle = `hsla(${p.hue},70%,${lum}%,${alp})`;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.strokeStyle = `hsla(${p.hue},90%,${45 + hit * 40}%,${0.5 + hit * 0.5})`;
    ctx.lineWidth = 1 + hit * 1.5;
    ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
    if (hit > 0.04) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `hsla(${p.hue},95%,60%,${hit * 0.24})`;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'lighter';
  const sg = ctx.createLinearGradient(sweep - 90, 0, sweep + 90, 0);
  sg.addColorStop(0, 'rgba(120,190,255,0)');
  sg.addColorStop(0.5, 'rgba(150,210,255,0.10)');
  sg.addColorStop(1, 'rgba(120,190,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(sweep - 90, 0, 180, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
}

/* ── AudioReactive — radial spectrum + waveform ring on a beat ────────── */
function audio(t) {
  ctx.fillStyle = '#070308'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const beat = Math.pow(0.5 + 0.5 * Math.sin(t * TAU * 4 - Math.PI / 2), 3);
  ctx.globalCompositeOperation = 'lighter';
  const bg = ctx.createRadialGradient(cx, cy, 10, cx, cy, 260);
  bg.addColorStop(0, `rgba(255,60,120,${0.10 + beat * 0.10})`);
  bg.addColorStop(1, 'rgba(255,60,120,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const N = 96, base = 74 + beat * 10;
  for (let i = 0; i < N; i++) {
    const ang = (i / N) * TAU - Math.PI / 2;
    const f =
      0.35 * (0.5 + 0.5 * Math.sin(i * 0.55 + t * TAU * 2)) +
      0.35 * (0.5 + 0.5 * Math.sin(i * 1.7 - t * TAU * 4)) +
      0.30 * beat * (0.5 + 0.5 * Math.sin(i * 3.1 + t * TAU));
    const len = 8 + f * 74;
    const hue = 330 - (i / N) * 140;
    ctx.strokeStyle = `hsla(${hue},95%,${50 + f * 22}%,${0.5 + f * 0.5})`;
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * base, cy + Math.sin(ang) * base);
    ctx.lineTo(cx + Math.cos(ang) * (base + len), cy + Math.sin(ang) * (base + len));
    ctx.stroke();
  }
  ctx.strokeStyle = `hsla(190,90%,65%,${0.5 + beat * 0.4})`;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i <= 140; i++) {
    const ang = (i / 140) * TAU;
    const rr = base - 16 + Math.sin(ang * 9 + t * TAU * 3) * (3 + beat * 7);
    const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

const SCENES = {aurora, particleWall, kinect, stage, audio};
window.renderFrame = (scene, i, n) => { SCENES[scene](i / n); return true; };
window.grabPNG = () => cv.toDataURL('image/png');
</script>
